---
name: Self Test

"on":
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck jq
          sudo snap install yq

      - name: Run tests
        env:
          DRY_RUN: "true"
          TARGET_REPO: owner/repo
          TARGET_REPOS: owner/repo
          MY_GITHUB_USERNAME: testuser
        run: make test
