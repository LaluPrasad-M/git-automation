---
name: Claude Git Sentinel

"on":
  repository_dispatch:
    types:
      - pr_notification
      - pr_review_requested
      - pr_comment_received
      - pr_ci_completed
      - pr_approval_received
      - manual_trigger

permissions:
  contents: read

env:
  MY_GITHUB_USERNAME: ${{ vars.MY_GITHUB_USERNAME }}
  GH_TOKEN: ${{ secrets.MY_PAT }}
  TARGET_REPOS: ${{ vars.TARGET_REPOS }}

jobs:
  sentinel:
    runs-on: ubuntu-latest
    concurrency:
      group: sentinel-${{ github.event.client_payload.target_repo }}-${{ github.event.client_payload.pr_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y jq coreutils
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
          npm install -g @anthropic-ai/claude-code

      - name: Run sentinel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORKSPACE: ${{ github.workspace }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          bash workflows/dispatch.sh '${{ toJSON(github.event.client_payload) }}'
