---
name: Scheduled PR Check

"on":
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.MY_PAT }}
  MY_GITHUB_USERNAME: ${{ vars.MY_GITHUB_USERNAME }}
  TARGET_REPOS_JSON: ${{ vars.TARGET_REPOS_JSON }}

jobs:
  dispatch-pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Dispatch review candidates
        run: |
          parse_repos() {
            local raw="$1"
            if echo "$raw" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "$raw" | jq -r '.[]'
            else
              echo "$raw" | tr ',' '\n' | \
                sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
                sed '/^$/d'
            fi
          }
          parse_repos "$TARGET_REPOS_JSON" | while read -r repo; do
            [ -z "$repo" ] && continue

            search_query="review-requested:$MY_GITHUB_USERNAME state:open"
            gh pr list --repo "$repo" \
              --search "$search_query" \
              --json number,author \
              --jq '.[] | @base64' | while read -r row; do
                [ -z "$row" ] && continue
                decoded="$(echo "$row" | base64 --decode)"
                num="$(echo "$decoded" | jq -r '.number')"
                author="$(echo "$decoded" | jq -r '.author.login')"
                if [ "$author" != "$MY_GITHUB_USERNAME" ]; then
                  gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
                    -f event_type=pr_review_requested \
                    -f "client_payload[action]=review" \
                    -f "client_payload[pr_number]=$num" \
                    -f "client_payload[target_repo]=$repo" \
                    -f "client_payload[source]=scheduled"
                fi
              done
          done
